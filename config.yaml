server:
  port: 8080

auth:
  enabled: false
  username: admin
  password: password

# Read-only keys for GET /api/v1/health and GET /api/v1/backups/status.
# Store the SHA-256 hex hash of the key, not the key itself.
# api_keys:
#   - name: dashboard
#     hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
#     prefix: "gd_0123abcd"
# Keys created in the web UI are written here when the config file is read-only.
# api_keys_file: /backups/api-keys.yaml

notifications:
  events:
    on_success: false
    on_failure: true
  email:
    enabled: false
    host: smtp.example.com
    port: 587
    username: myuser
    password: mypassword
    from: godump@example.com
    to: you@example.com
  webhooks: []

logging:
  file: ""

instances:
  - name: primary
    host: 127.0.0.1
    port: 3306
    user: backup
    password: secret
    backup_dir: /backups/primary
    # Optional: write dumps locally first, then copy the gzip to backup_dir.
    # Useful when backup_dir is a remote/S3 mount.
    # temp_dir: /tmp/godump
    retention_days: 14
    schedule: "0 2 * * *"
